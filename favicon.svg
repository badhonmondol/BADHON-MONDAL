<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="50%" style="stop-color:#9b59ff"/>
      <stop offset="100%" style="stop-color:#f000b8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="100" height="100" fill="#01010a" rx="14"/>
  <!-- Hexagon outline -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28"
           fill="none" stroke="url(#g1)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- BR text -->
  <text x="50" y="62" text-anchor="middle" font-size="38" font-weight="900"
        fill="url(#g1)" font-family="Orbitron,Arial,sans-serif" filter="url(#glow)">BR</text>
</svg>

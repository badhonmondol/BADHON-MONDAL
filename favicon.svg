<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#01010a"/>
      <stop offset="100%" style="stop-color:#0a0a1c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="50%" style="stop-color:#9b59ff"/>
      <stop offset="100%" style="stop-color:#f000b8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)" rx="18"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.9"/>
  <text x="50" y="64" text-anchor="middle" font-size="54" font-weight="900"
        fill="#00e5ff" font-family="Orbitron,monospace" filter="url(#glow)">R</text>
</svg>
